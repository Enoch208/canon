[project]
name = "canon-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "canon-graph",
    "canon-retrieval",
    "canon-extraction",
    "canon-evaluation",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canon_api"]

[tool.uv.sources]
canon-graph = { workspace = true }
canon-retrieval = { workspace = true }
canon-extraction = { workspace = true }
canon-evaluation = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
