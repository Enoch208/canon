[project]
name = "canon-evaluation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "canon-graph",
    "canon-retrieval",
    "canon-extraction",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canon_evaluation"]

[tool.uv.sources]
canon-graph = { workspace = true }
canon-retrieval = { workspace = true }
canon-extraction = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
