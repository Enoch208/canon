[project]
name = "canon-extraction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["canon-graph", "canon-retrieval", "anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canon_extraction"]

[tool.uv.sources]
canon-graph = { workspace = true }
canon-retrieval = { workspace = true }
